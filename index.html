<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Manrope", sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
        }
    </style>
</head>

<body>

    <!-- Dhayan -->
    <header>
        <h1 class="text-2xl font-bold bg-blue-500">Welcome to My Website</h1>
    </header>

    <!-- Bryan -->
        <main class="min-h-[70vh] bg-[#f2f2ef] px-6 py-16 md:px-10 lg:px-20">
        <section class="mx-auto flex max-w-6xl items-center justify-center">
            <div class="text-center">
                <div class="mb-8 flex items-center justify-center gap-3">
                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">Make</span>
                    </h1>

                    <div class="flex -space-x-3">
                        <div class="flex h-14 w-14 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-sky-200 via-sky-300 to-sky-500 text-xs font-bold text-zinc-900 shadow-md md:h-16 md:w-16">A</div>
                        <div class="flex h-14 w-14 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-amber-200 via-orange-300 to-orange-500 text-xs font-bold text-zinc-900 shadow-md md:h-16 md:w-16">B</div>
                        <div class="flex h-14 w-14 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-violet-200 via-fuchsia-300 to-pink-500 text-xs font-bold text-zinc-900 shadow-md md:h-16 md:w-16">C</div>
                    </div>

                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">Your</span>
                    </h1>
                </div>

                <div class="flex items-center justify-center gap-4 md:gap-6">
                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">App</span>
                    </h1>

                    <div class="flex h-16 w-16 items-center justify-center rounded-full border-[6px] border-zinc-900 bg-white shadow-[inset_0_0_0_12px_#fff] md:h-20 md:w-20">
                        <span class="inline-block h-6 w-6 rounded-full border-[6px] border-zinc-900 bg-white md:h-8 md:w-8"></span>
                    </div>

                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">Happen</span>
                    </h1>
                </div>

                <p class="mx-auto mt-8 max-w-2xl text-lg leading-8 text-zinc-600 md:text-xl">
                    Aaply helps teams design mobile apps and create a human-centered product experience
                </p>

                <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
                    <button class="rounded-xl bg-zinc-950 px-7 py-4 text-base font-semibold text-white shadow-lg shadow-zinc-300 transition hover:bg-zinc-800">
                        Try demo project
                    </button>
                    <button class="flex items-center gap-2 rounded-xl border border-zinc-300 bg-white px-7 py-4 text-base font-semibold text-zinc-900 shadow-sm transition hover:bg-zinc-100">
                        <span>Sign up for free</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Zurisarai -->
     <footer class="bg-[#d9eb2d] px-4 py-5 md:px-8">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 rounded-[2rem] bg-[#d9eb2d] px-2 py-3">
            <div class="flex items-center gap-4">
                <div class="flex h-12 w-12 items-center justify-center rounded-full bg-[#d96d4a] text-2xl shadow-inner">🧑‍💼</div>

                <div class="text-left">
                    <p class="text-3xl font-black leading-none tracking-[-0.06em] text-zinc-950 md:text-5xl">
                        Aaply <span class="font-extrabold">→</span> Figma
                    </p>
                    <p class="mt-1 text-lg font-medium leading-none text-zinc-900 md:text-2xl">
                        plugin is here!
                    </p>
                    <p class="mt-3 text-sm text-zinc-900 md:text-base">
                        Export your project to Figma in a few clicks!
                    </p>
                    <button class="mt-4 rounded-full bg-zinc-950 px-5 py-2.5 text-sm font-semibold text-white shadow-md transition hover:bg-zinc-800 md:text-base">
                        How it works
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-center gap-5 pr-2 md:gap-8">
                <div class="relative flex h-28 w-28 items-center justify-center rounded-[2rem] bg-[#0f1115] shadow-[0_18px_35px_rgba(0,0,0,0.18)] md:h-32 md:w-32">
                    <div class="absolute left-6 top-7 h-10 w-10 rounded-full border-4 border-white"></div>
                    <div class="absolute right-6 bottom-7 h-10 w-10 rounded-full border-4 border-white"></div>
                    <div class="absolute left-1/2 top-1/2 h-12 w-12 -translate-x-1/2 -translate-y-1/2 rounded-[1.2rem] border-[6px] border-white"></div>
                </div>

                <div class="flex h-28 w-28 items-center justify-center rounded-[2rem] bg-[#0f1115] shadow-[0_18px_35px_rgba(0,0,0,0.18)] md:h-32 md:w-32">
                    <div class="flex h-16 w-16 items-center justify-center rounded-[1.5rem] bg-gradient-to-br from-[#ff7a59] via-[#ff5f7d] to-[#c53dff] shadow-inner">
                        <div class="h-8 w-8 rounded-[0.8rem] bg-white/15"></div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
