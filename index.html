<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Manrope", sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
        }
    </style>
</head>

<body class="bg-[#f2f2ef]">

    <!-- Dhayan -->
    <header class="relative z-10 bg-white rounded-b-3xl px-6 md:px-12 pt-4 pb-5 max-w-7xl mx-auto flex items-center justify-between shadow-md">
        <!-- Logo -->
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-full bg-[#d7fa00] flex items-center justify-center shadow-xs">
                <!-- aaply arrow icon -->
                <svg class="w-4 h-4 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="6" y1="12" x2="16" y2="12" />
                    <polyline points="12 8 16 12 12 16" />
                </svg>
            </div>
            <div class="flex items-start">
                <span class="text-2xl font-extrabold tracking-tight text-black leading-none">aaply</span>
                <span class="text-[11px] font-semibold text-gray-500 ml-0.5 relative -top-1">beta</span>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold text-gray-700">
            <a href="#" class="hover:text-black transition-colors">Features</a>
            <a href="#" class="hover:text-black transition-colors">Figma Plugin</a>
            <a href="#" class="hover:text-black transition-colors">Value</a>
            <a href="#" class="hover:text-black transition-colors">Pricing</a>
            <a href="#" class="hover:text-black transition-colors">Reviews</a>
        </nav>

        <!-- Buttons -->
        <div class="flex items-center gap-3">
            <a href="#" class="text-sm font-semibold text-gray-700 px-5 py-2.5 rounded-full border border-gray-200 hover:bg-gray-50 transition-colors">
                Log in
            </a>
            <a href="#" class="text-sm font-semibold text-white bg-black hover:bg-gray-800 px-5 py-2.5 rounded-full flex items-center gap-2 transition-colors">
                <span>Sign up</span>
                <span aria-hidden="true">→</span>
            </a>
        </div>
    </header>

    <!-- Bryan -->
        <main class="min-h-[70vh] bg-[#f2f2ef] px-6 py-8 md:py-12 md:px-10 lg:px-20">
        <section class="mx-auto flex max-w-6xl items-center justify-center">
            <div class="text-center">
                <div class="mb-8 flex items-center justify-center gap-3">
                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">Make</span>
                    </h1>

                    <div class="flex -space-x-3">
                        <div class="flex h-14 w-14 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-sky-200 via-sky-300 to-sky-500 text-xs font-bold text-zinc-900 shadow-md md:h-16 md:w-16">A</div>
                        <div class="flex h-14 w-14 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-amber-200 via-orange-300 to-orange-500 text-xs font-bold text-zinc-900 shadow-md md:h-16 md:w-16">B</div>
                        <div class="flex h-14 w-14 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-violet-200 via-fuchsia-300 to-pink-500 text-xs font-bold text-zinc-900 shadow-md md:h-16 md:w-16">C</div>
                    </div>

                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">Your</span>
                    </h1>
                </div>

                <div class="flex items-center justify-center gap-4 md:gap-6">
                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">App</span>
                    </h1>

                    <div class="flex h-16 w-16 items-center justify-center rounded-full border-[6px] border-zinc-900 bg-white shadow-[inset_0_0_0_12px_#fff] md:h-20 md:w-20">
                        <span class="inline-block h-6 w-6 rounded-full border-[6px] border-zinc-900 bg-white md:h-8 md:w-8"></span>
                    </div>

                    <h1 class="text-5xl font-black tracking-[-0.08em] text-zinc-950 md:text-7xl lg:text-[7.2rem]">
                        <span class="inline-block">Happen</span>
                    </h1>
                </div>

                <p class="mx-auto mt-8 max-w-2xl text-lg leading-8 text-zinc-600 md:text-xl">
                    Aaply helps teams design mobile apps and create a human-centered product experience
                </p>

                <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
                    <button class="rounded-xl bg-zinc-950 px-7 py-4 text-base font-semibold text-white shadow-lg shadow-zinc-300 transition hover:bg-zinc-800">
                        Try demo project
                    </button>
                    <button class="flex items-center gap-2 rounded-xl border border-zinc-300 bg-white px-7 py-4 text-base font-semibold text-zinc-900 shadow-sm transition hover:bg-zinc-100">
                        <span>Sign up for free</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Zuri -->
    <footer>
        <p>&copy; 2024 My Website. All rights reserved.</p>
    </footer>
</body>

</html>
